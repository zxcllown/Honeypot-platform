services:
  redis:
    image: redis:7
    container_name: honeypot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend-api:
    build:
      context: ./backend
    container_name: honeypot-backend-api
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - redis

  workers:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: honeypot-workers
    command: ["python", "-m", "app.worker_runner"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    volumes:
      - ./backend/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: honeypot-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend-api

volumes:
  redis_data: